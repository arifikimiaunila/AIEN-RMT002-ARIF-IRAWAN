[project]
name = "p1m1-omnichannel-retail-nl2sql"
version = "0.1.0"
description = "Omnichannel retail analytics capstone with a separated NL-to-SQL engine and UI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pg8000>=1.31,<2",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "plotly>=5.24,<6",
    "streamlit>=1.40,<2",
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
