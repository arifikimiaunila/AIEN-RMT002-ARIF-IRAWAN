services:
  postgres:
    image: postgres:16
    container_name: retail-postgres
    environment:
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - retail_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  marquez-api:
    image: marquezproject/marquez:latest
    container_name: marquez-api
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      MARQUEZ_CONFIG: /conf/marquez.yml
    depends_on:
      postgres:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:latest
    container_name: marquez-web
    ports:
      - "3000:3000"
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    depends_on:
      - marquez-api

  nl2sql-api:
    build: .
    container_name: nl2sql-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      ANALYTICS_DB_TARGET: local
      LOCAL_POSTGRES_HOST: postgres
      LOCAL_POSTGRES_PORT: 5432
      LOCAL_POSTGRES_DB: retail_analytics
      LOCAL_POSTGRES_USER: retail
      LOCAL_POSTGRES_PASSWORD: retail
      NL2SQL_PROVIDER: mock
      OPENLINEAGE_URL: http://marquez-api:5000
      OPENLINEAGE_NAMESPACE: retail_analytics
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app

  analytics-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analytics-ui
    environment:
      ENGINE_URL: http://nl2sql-api:8000
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    depends_on:
      - nl2sql-api
    volumes:
      - ./:/app

  airflow:
    image: apache/airflow:2.9.3
    container_name: retail-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail:retail@postgres:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      OPENLINEAGE_URL: http://marquez-api:5000
      OPENLINEAGE_NAMESPACE: retail_analytics
    ports:
      - "8080:8080"
    volumes:
    - ./dags:/opt/airflow/dags
    - ./database:/opt/airflow/database
    - ./database/schemas:/opt/airflow/database/schemas
    - ./raw_data_validation:/opt/airflow/raw_data_validation
    - ./include:/opt/airflow/include
    - ./pipelines:/opt/airflow/pipelines
    - ./validation_report:/opt/airflow/validation_report
    - ./data:/opt/airflow/data
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true; airflow standalone"

volumes:
  retail_postgres_data: